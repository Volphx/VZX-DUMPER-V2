name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        shell: cmd
        run: PUBLICAR_RELEASE.cmd
      - name: Package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content VZX_Dumper_UI/Il2CppDumper_ImGuiStyle.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force artifacts/package | Out-Null
          Copy-Item artifacts/win-x64/VZX-Dumper.exe artifacts/package/
          Copy-Item README.md,CHANGELOG.md artifacts/package/
          Copy-Item Il2CppDumper_Core/LICENSE artifacts/package/IL2CPPDUMPER-LICENSE.txt
          Compress-Archive artifacts/package/* "artifacts/VZX-Dumper-v$version-win-x64.zip"
          $zip = Get-Item "artifacts/VZX-Dumper-v$version-win-x64.zip"
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $($zip.Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VZX-Dumper-win-x64
          path: |
            artifacts/VZX-Dumper-*-win-x64.zip
            artifacts/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; keeping existing assets.'; exit 0 }
          gh release create $env:RELEASE_TAG artifacts/VZX-Dumper-*-win-x64.zip artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VZX Dumper $env:RELEASE_TAG" --notes-file CHANGELOG.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
